<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Ценности</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #06060a; font-family: 'Courier New', monospace; color: #fff; height: 100vh; overflow: hidden; user-select: none; }

    .screen { display: none; position: fixed; inset: 0; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; }
    .screen.active { display: flex; }

    .s-title { font-size: clamp(18px,5vw,28px); font-weight: 900; letter-spacing: 0.2em; color: rgba(255,255,255,0.88); margin-bottom: 18px; }
    .s-sub   { font-size: clamp(12px,2.5vw,14px); color: rgba(255,255,255,0.38); line-height: 1.9; letter-spacing: 0.05em; max-width: 400px; white-space: pre-line; margin-bottom: 40px; }
    .s-btn   { background: transparent; border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.65); font-family: inherit; font-size: 11px; letter-spacing: 0.25em; padding: 13px 36px; cursor: pointer; transition: all .2s; }
    .s-btn:hover { border-color: rgba(255,255,255,0.4); color: #fff; }

    /* ── Sort screen ── */
    #sort-screen { padding: 0; justify-content: flex-start; }

    /* Top bar */
    #top-bar { width: 100%; padding: 16px 18px 10px; flex-shrink: 0; }
    #progress-track { width: 100%; height: 1px; background: rgba(255,255,255,0.07); margin-bottom: 10px; }
    #progress-fill  { height: 100%; background: rgba(255,255,255,0.22); transition: width .3s; }
    #top-row { display: flex; align-items: center; justify-content: space-between; }
    #round-label  { font-size: 9px; letter-spacing: 0.3em; color: rgba(255,255,255,0.18); }
    #card-counter { font-size: 9px; letter-spacing: 0.15em; color: rgba(255,255,255,0.18); }
    #add-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.35);
      font-family: inherit; font-size: 15px;
      width: 26px; height: 26px; border-radius: 50%;
      cursor: pointer; transition: all .15s;
      display: flex; align-items: center; justify-content: center;
      line-height: 1; padding-bottom: 1px;
    }
    #add-btn:hover { border-color: rgba(255,255,255,0.35); color: #fff; }

    /* Card area */
    #card-area {
      flex: 1; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      width: 100%; padding: 8px 20px;
      perspective: 1400px;
    }
    #card-wrap {
      width: min(300px, 78vw);
      height: min(410px, 100%);
      position: relative;
      transform-style: preserve-3d;
      transition: transform .42s cubic-bezier(.4,0,.2,1);
      cursor: pointer;
      flex-shrink: 0;
    }
    #card-wrap.flipped { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0; border-radius: 16px;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 20px;
    }
    .face.front { background: #f5f3ef; }
    .face.back  { background: #f5f3ef; transform: rotateY(180deg); }
    #card-title      { font-size: clamp(20px,6.5vw,34px); font-weight: 900; color: #09090f; letter-spacing: .04em; text-transform: uppercase; text-align: center; line-height: 1.1; }
    #card-tap-hint   { position: absolute; bottom: 16px; font-size: 8px; letter-spacing: .18em; color: rgba(9,9,15,.2); }
    #card-title-back { font-size: clamp(12px,3vw,15px); font-weight: 700; color: rgba(9,9,15,.4); letter-spacing: .1em; text-transform: uppercase; text-align: center; margin-bottom: 14px; }
    #card-desc       { font-size: clamp(12px,2.8vw,14px); color: #1a1a2e; text-align: center; line-height: 1.7; }

    /* ── Pile zone ── */
    #pile-zone {
      width: 100%; flex-shrink: 0;
      display: flex; gap: 6px;
      padding: 0 12px 20px;
      height: 165px;
    }
    .pile-area {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding-top: 10px; cursor: pointer;
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      transition: background .15s, border-color .15s;
      overflow: hidden;
    }
    .pile-area:active { background: rgba(255,255,255,0.06); }
    #pa-high { border-color: rgba(255,255,255,0.11); background: rgba(255,255,255,0.04); }

    /* Mini card stack */
    .pile-stack { position: relative; width: 44px; height: 58px; flex-shrink: 0; }
    .ps-b2 { position: absolute; inset: 0; border-radius: 7px; background: rgba(255,255,255,0.08); transform: rotate(-5deg) translate(-1px,2px); }
    .ps-b1 { position: absolute; inset: 0; border-radius: 7px; background: rgba(255,255,255,0.13); transform: rotate(3deg) translate(1px,1px); }
    .ps-top {
      position: absolute; inset: 0; border-radius: 7px; z-index: 1;
      background: transparent; border: 1px dashed rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 6px; font-weight: 700; color: #09090f;
      text-align: center; padding: 3px; letter-spacing: .04em;
      overflow: hidden; transition: background .2s, border .2s;
      line-height: 1.3;
    }
    .ps-top.filled { background: rgba(245,243,239,0.9); border-color: transparent; }
    @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.12)} 100%{transform:scale(1)} }
    .ps-top.pop { animation: pop .22s ease-out; }

    .pile-count {
      font-size: 20px; font-weight: 900; color: rgba(255,255,255,0.5);
      margin-top: 7px; line-height: 1;
      transition: all .2s;
    }
    #pa-high .pile-count { color: rgba(255,255,255,0.75); }
    .pile-label {
      font-size: 7px; letter-spacing: .12em; color: rgba(255,255,255,0.22);
      text-align: center; margin-top: 4px; line-height: 1.5;
    }
    #pa-high .pile-label { color: rgba(255,255,255,0.4); }

    /* ── Summary ── */
    .pile-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 20px; margin: 4px 0; background: rgba(255,255,255,0.04); border-radius: 6px; width: min(320px,85vw); }
    .pile-name { font-size: 10px; letter-spacing: .18em; color: rgba(255,255,255,0.35); }
    .pile-n    { font-size: 22px; font-weight: bold; color: rgba(255,255,255,0.75); }

    /* ── Results ── */
    #chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 540px; max-height: 48vh; overflow-y: auto; margin: 4px 0 32px; }
    .chip  { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); border-radius: 4px; padding: 8px 16px; font-size: 11px; letter-spacing: .14em; color: rgba(255,255,255,0.82); animation: chipIn .4s both; }
    @keyframes chipIn { from{opacity:0;transform:scale(.85)} to{opacity:1;transform:scale(1)} }

    /* ── Card animations ── */
    @keyframes exitL { to { transform: translateX(-130%) rotate(-10deg); opacity:0; } }
    @keyframes exitR { to { transform: translateX(130%)  rotate(10deg);  opacity:0; } }
    @keyframes exitU { to { transform: translateY(-120%) scale(.88);     opacity:0; } }
    @keyframes enter { from { opacity:0; transform: scale(.9) translateY(12px); } to { opacity:1; transform:none; } }
    #card-area.exit-l #card-wrap { animation: exitL .3s forwards; }
    #card-area.exit-r #card-wrap { animation: exitR .3s forwards; }
    #card-area.exit-u #card-wrap { animation: exitU .3s forwards; }
    #card-area.entering #card-wrap { animation: enter .26s forwards; }

    /* ── Custom card modal ── */
    #modal {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(6,6,10,.88); backdrop-filter: blur(6px);
      align-items: center; justify-content: center;
    }
    #modal.open { display: flex; }
    .modal-box { background: #111118; border: 1px solid rgba(255,255,255,0.13); border-radius: 16px; padding: 28px 22px; width: min(330px,88vw); }
    .modal-title { font-size: 11px; letter-spacing: .25em; color: rgba(255,255,255,0.5); text-align: center; margin-bottom: 20px; }
    .modal-inp {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.11);
      border-radius: 8px; padding: 12px 14px; font-family: inherit; font-size: 14px;
      color: #fff; outline: none; margin-bottom: 10px; transition: border .15s;
    }
    .modal-inp::placeholder { color: rgba(255,255,255,0.2); }
    .modal-inp:focus { border-color: rgba(255,255,255,0.3); }
    .modal-ta { height: 72px; resize: none; }
    .modal-btns { display: flex; gap: 10px; margin-top: 6px; }
    .modal-btn { flex:1; background: transparent; border: 1px solid rgba(255,255,255,0.13); color: rgba(255,255,255,0.45); font-family: inherit; font-size: 10px; letter-spacing: .18em; padding: 11px; cursor: pointer; border-radius: 6px; transition: all .15s; }
    .modal-btn:hover { border-color: rgba(255,255,255,0.3); color: #fff; }
    .modal-btn.ok { border-color: rgba(255,255,255,0.22); color: rgba(255,255,255,0.78); }
  </style>
</head>
<body>

<!-- ── Welcome ── -->
<div id="s-welcome" class="screen active">
  <div class="s-title">ЦЕННОСТИ</div>
  <div class="s-sub">Три раунда сортировки карточек,
постепенно сужающих круг
до самых главных ценностей.

Доверяйтесь первому ощущению.</div>
  <button class="s-btn" onclick="begin()">НАЧАТЬ →</button>
</div>

<!-- ── Round intro ── -->
<div id="s-round" class="screen">
  <div class="s-title" id="round-title"></div>
  <div class="s-sub"   id="round-text"></div>
  <button class="s-btn" onclick="startSort()">НАЧАТЬ РАУНД →</button>
</div>

<!-- ── Sorting ── -->
<div id="sort-screen" class="screen">

  <div id="top-bar">
    <div id="progress-track"><div id="progress-fill" style="width:0%"></div></div>
    <div id="top-row">
      <span id="round-label">РАУНД 1 ИЗ 3</span>
      <span id="card-counter">1 / 56</span>
      <button id="add-btn" onclick="openModal()" title="Добавить свою ценность">+</button>
    </div>
  </div>

  <div id="card-area">
    <div id="card-wrap">
      <div class="face front">
        <div id="card-title">ЦЕННОСТЬ</div>
        <div id="card-tap-hint">НАЖМИТЕ — ПОДРОБНЕЕ</div>
      </div>
      <div class="face back">
        <div id="card-title-back"></div>
        <div id="card-desc"></div>
      </div>
    </div>
  </div>

  <div id="pile-zone">
    <!-- НЕ ОЧЕНЬ ВАЖНО -->
    <div class="pile-area" id="pa-low" onclick="sort('low')">
      <div class="pile-stack">
        <div class="ps-b2"></div><div class="ps-b1"></div>
        <div class="ps-top" id="pt-low"></div>
      </div>
      <div class="pile-count" id="pb-low">0</div>
      <div class="pile-label">НЕ ОЧЕНЬ<br>ВАЖНО</div>
    </div>
    <!-- ОЧЕНЬ ВАЖНО -->
    <div class="pile-area" id="pa-high" onclick="sort('high')">
      <div class="pile-stack">
        <div class="ps-b2"></div><div class="ps-b1"></div>
        <div class="ps-top" id="pt-high"></div>
      </div>
      <div class="pile-count" id="pb-high">0</div>
      <div class="pile-label">ОЧЕНЬ<br>ВАЖНО</div>
    </div>
    <!-- ВАЖНО -->
    <div class="pile-area" id="pa-medium" onclick="sort('medium')">
      <div class="pile-stack">
        <div class="ps-b2"></div><div class="ps-b1"></div>
        <div class="ps-top" id="pt-medium"></div>
      </div>
      <div class="pile-count" id="pb-medium">0</div>
      <div class="pile-label">ВАЖНО</div>
    </div>
  </div>
</div>

<!-- ── Round summary ── -->
<div id="s-summary" class="screen">
  <div class="s-title" id="sum-title"></div>
  <div class="pile-row"><span class="pile-name">ОЧЕНЬ ВАЖНО</span><span class="pile-n" id="cnt-h">0</span></div>
  <div class="pile-row"><span class="pile-name">ВАЖНО</span><span class="pile-n" id="cnt-m">0</span></div>
  <div class="pile-row"><span class="pile-name">НЕ ОЧЕНЬ ВАЖНО</span><span class="pile-n" id="cnt-l">0</span></div>
  <div class="s-sub" id="sum-text" style="margin-top:22px; margin-bottom:22px;"></div>
  <button class="s-btn" onclick="nextRound()">ПРОДОЛЖИТЬ →</button>
</div>

<!-- ── Results ── -->
<div id="s-results" class="screen">
  <div class="s-title">ВАШИ ЦЕННОСТИ</div>
  <div class="s-sub" id="res-sub" style="margin-bottom:16px;"></div>
  <div id="chips"></div>
  <button class="s-btn" onclick="restart()">НАЧАТЬ ЗАНОВО</button>
</div>

<!-- ── Custom card modal ── -->
<div id="modal">
  <div class="modal-box">
    <div class="modal-title">СВОЯ ЦЕННОСТЬ</div>
    <input  id="inp-title" class="modal-inp" placeholder="Название" maxlength="28" autocomplete="off"/>
    <textarea id="inp-desc" class="modal-inp modal-ta" placeholder="Описание (необязательно)" maxlength="140"></textarea>
    <div class="modal-btns">
      <button class="modal-btn"    onclick="closeModal()">ОТМЕНА</button>
      <button class="modal-btn ok" onclick="addCustom()">ДОБАВИТЬ →</button>
    </div>
  </div>
</div>

<script>
const CARDS = [
  {t:'Партнёрство',       d:'Быть надёжным и поддерживающим партнёром в близких отношениях'},
  {t:'Терпение',           d:'Проявлять терпение к себе и другим в сложных ситуациях'},
  {t:'Мастерство',         d:'Стремиться к совершенству в важных для меня делах и навыках'},
  {t:'Упорство',           d:'Продолжать двигаться вперёд, несмотря на трудности и препятствия'},
  {t:'Сексуальность',      d:'Исследовать и выражать свою сексуальность открыто и честно'},
  {t:'Ответственность',    d:'Брать на себя ответственность за свои действия и их последствия'},
  {t:'Благодарность',      d:'Замечать и ценить хорошее в своей жизни и в других людях'},
  {t:'Искренность',        d:'Быть честным и открытым в выражении своих мыслей и чувств'},
  {t:'Забота',             d:'Проявлять искреннюю заботу о благополучии близких'},
  {t:'Гибкость',           d:'Адаптироваться к изменениям и быть открытым к новым подходам'},
  {t:'Щедрость',           d:'Делиться своим временем, вниманием и ресурсами с другими'},
  {t:'Поддержка',          d:'Оказывать помощь и поддержку тем, кто в этом нуждается'},
  {t:'Прощение',           d:'Отпускать обиды и прощать себя и других за ошибки'},
  {t:'Контакт',            d:'Поддерживать глубокий эмоциональный контакт с важными людьми'},
  {t:'Воодушевление',      d:'Вдохновлять и воодушевлять других своим примером и словами'},
  {t:'Аутентичность',      d:'Быть собой, жить в соответствии со своими истинными ценностями'},
  {t:'Великодушие',        d:'Проявлять щедрость духа и доброту в отношениях с другими'},
  {t:'Доверие',            d:'Строить и поддерживать доверительные отношения с другими'},
  {t:'Принятие',           d:'Принимать себя, свои переживания и других людей без осуждения'},
  {t:'Романтика',          d:'Привносить романтику, нежность и красоту в близкие отношения'},
  {t:'Чувственность',      d:'Наслаждаться чувственными переживаниями и телесными удовольствиями'},
  {t:'Любопытство',        d:'Исследовать мир с открытым умом и интересом к новому'},
  {t:'Вклад',              d:'Вносить значимый вклад в жизнь других людей и общества'},
  {t:'Забота о себе',      d:'Уделять внимание собственному физическому и эмоциональному здоровью'},
  {t:'Юмор',               d:'Сохранять лёгкость, игривость и способность смеяться над собой'},
  {t:'Творчество',         d:'Создавать новое, выражать себя через творческую деятельность'},
  {t:'Вдумчивость',        d:'Размышлять глубоко и осознанно перед принятием важных решений'},
  {t:'Независимость',      d:'Делать самостоятельный выбор и жить согласно своим убеждениям'},
  {t:'Откровенность',      d:'Открыто делиться своими мыслями, чувствами и переживаниями'},
  {t:'Порядок',            d:'Поддерживать структуру и организованность в жизни'},
  {t:'Справедливость',     d:'Быть справедливым и объективным по отношению к себе и другим'},
  {t:'Сострадание',        d:'По-доброму обращаться с собой и другими в моменты боли'},
  {t:'Веселье',            d:'Получать удовольствие, веселиться, создавать радостные занятия'},
  {t:'Скромность',         d:'Быть смиренным, позволяя своим достижениям говорить за себя'},
  {t:'Равенство',          d:'Обращаться с разными людьми и с собой на равных'},
  {t:'Само-уважение',      d:'Относиться к себе с вниманием, достоинством и заботой'},
  {t:'Настойчивость',      d:'Последовательно следовать своему пути, несмотря на трудности'},
  {t:'Трудолюбие',         d:'Быть предприимчивым и трудолюбивым в своём деле'},
  {t:'Физическая форма',   d:'Поддерживать и улучшать физическое и психологическое здоровье'},
  {t:'Широта взглядов',    d:'Рассматривать разные точки зрения и честно оценивать факты'},
  {t:'Свобода',            d:'Самостоятельно выбирать как жить и помогать другим делать то же'},
  {t:'Честность',          d:'Быть правдивым и искренним с собой и с другими'},
  {t:'Само-развитие',      d:'Расти, совершенствоваться и углублять свои знания и навыки'},
  {t:'Духовность',         d:'Чувствовать связь с чем-то большим, чем мы сами'},
  {t:'Дружелюбие',         d:'Быть открытым, приветливым и коммуникабельным'},
  {t:'Красота',            d:'Ценить, создавать, сохранять и взращивать красоту'},
  {t:'Доброта',            d:'Быть внимательным и заботливым по отношению к себе и другим'},
  {t:'Уверенность',        d:'Отстаивать свои права и просить о том, что мне нужно'},
  {t:'Мужество',           d:'Быть отважным и не отступать перед лицом страха и трудностей'},
  {t:'Любовь',             d:'Относиться с любовью и теплом к себе и другим'},
  {t:'Вызов',              d:'Постоянно бросать себе вызов, расти, учиться, совершенствоваться'},
  {t:'Близость',           d:'Открываться и делиться собой эмоционально и физически в близких отношениях'},
  {t:'Добросовестность',   d:'Быть беспристрастным и непредвзятым к себе и другим'},
  {t:'Энергичность',       d:'Искать и создавать деятельность, которая вдохновляет и наполняет энергией'},
  {t:'Приключения',        d:'Активно исследовать новые стимулирующие переживания и творить'},
  {t:'Безопасность',       d:'Обеспечивать безопасность — собственную и окружающих'},
];

let round=1, deck=[], hi=[], mid=[], lo=[], idx=0, busy=false;

function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

// ── Start ──
function begin(){ round=1; deck=shuffle([...CARDS]); showRoundIntro(); }

function showRoundIntro(){
  const titles=['','РАУНД 1 ИЗ 3','РАУНД 2 ИЗ 3','РАУНД 3 ИЗ 3'];
  const texts=[
    '',
    `Перед вами ${deck.length} карточек.\n\nРаспределите каждую по стопкам:\n«Очень важно», «Важно» или «Не очень важно».\n\nДоверяйтесь первому ощущению.`,
    `${deck.length} карточек, которые показались\nочень важными.\n\nЧто действительно важно?\nЧто можно отпустить?`,
    `Финальный круг. ${deck.length} карточек.\n\nВыберите то, что составляет самую суть.`,
  ];
  document.getElementById('round-title').textContent=titles[round];
  document.getElementById('round-text').textContent=texts[round];
  show('s-round');
}

function startSort(){
  hi=[]; mid=[]; lo=[]; idx=0; busy=false;
  // reset piles
  ['high','medium','low'].forEach(p=>{
    const top=document.getElementById('pt-'+p);
    top.classList.remove('filled','pop');
    top.textContent='';
    document.getElementById('pb-'+p).textContent='0';
  });
  document.getElementById('round-label').textContent=`РАУНД ${round} ИЗ 3`;
  show('sort-screen');
  loadCard();
}

// ── Card ──
function loadCard(){
  const c=deck[idx];
  document.getElementById('progress-fill').style.width=(idx/deck.length*100)+'%';
  document.getElementById('card-counter').textContent=`${idx+1} / ${deck.length}`;
  document.getElementById('card-title').textContent=c.t.toUpperCase();
  document.getElementById('card-title-back').textContent=c.t.toUpperCase();
  document.getElementById('card-desc').textContent=c.d;
  document.getElementById('card-wrap').classList.remove('flipped');
  const area=document.getElementById('card-area');
  area.className='entering'; void area.offsetWidth; area.className='entering';
}

document.getElementById('card-wrap').addEventListener('click',()=>{ if(!busy) document.getElementById('card-wrap').classList.toggle('flipped'); });

// ── Sort ──
function sort(pile){
  if(busy) return; busy=true;
  const card=deck[idx];
  if(pile==='high')   hi.push(card);
  if(pile==='medium') mid.push(card);
  if(pile==='low')    lo.push(card);
  updatePile(pile,card);
  const area=document.getElementById('card-area');
  area.className=pile==='low'?'exit-l':pile==='medium'?'exit-r':'exit-u';
  setTimeout(()=>{ idx++; busy=false; if(idx>=deck.length){showSummary();}else{loadCard();} },320);
}

function updatePile(key,card){
  const counts={high:hi.length,medium:mid.length,low:lo.length};
  document.getElementById('pb-'+key).textContent=counts[key];
  const top=document.getElementById('pt-'+key);
  top.textContent=card.t.toUpperCase();
  top.classList.add('filled');
  top.classList.remove('pop'); void top.offsetWidth; top.classList.add('pop');
}

// ── Keyboard ──
document.addEventListener('keydown',e=>{
  if(!document.getElementById('sort-screen').classList.contains('active')) return;
  if(e.key==='ArrowLeft' ||e.key==='1') sort('low');
  if(e.key==='ArrowUp'   ||e.key==='2') sort('high');
  if(e.key==='ArrowRight'||e.key==='3') sort('medium');
  if(e.key===' '){ e.preventDefault(); document.getElementById('card-wrap').classList.toggle('flipped'); }
});

// ── Swipe ──
let tx0=0,ty0=0;
document.getElementById('card-area').addEventListener('touchstart',e=>{ tx0=e.touches[0].clientX; ty0=e.touches[0].clientY; },{passive:true});
document.getElementById('card-area').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
  const ax=Math.abs(dx), ay=Math.abs(dy);
  if(ax<12&&ay<12) return;
  if(ay>ax&&dy<-40) sort('high');
  else if(ax>40&&dx<0) sort('low');
  else if(ax>40&&dx>0) sort('medium');
},{passive:true});

// ── Summary ──
function showSummary(){
  if(hi.length===0) hi=[...mid];
  document.getElementById('cnt-h').textContent=hi.length;
  document.getElementById('cnt-m').textContent=mid.length;
  document.getElementById('cnt-l').textContent=lo.length;
  document.getElementById('sum-title').textContent=`РАУНД ${round} ЗАВЕРШЁН`;
  const nextN=hi.length;
  document.getElementById('sum-text').textContent=
    round<3 ? `В следующем раунде работаем\nс ${nextN} карточками из стопки «Очень важно».` : 'Все раунды пройдены.';
  show('s-summary');
}

function nextRound(){
  if(round>=3||hi.length===0){showResults();return;}
  round++; deck=shuffle(hi); showRoundIntro();
}

// ── Results ──
function showResults(){
  const final=hi.length>0?hi:mid;
  document.getElementById('res-sub').textContent=`${final.length} ценност${end(final.length)}, которые важнее всего`;
  const box=document.getElementById('chips'); box.innerHTML='';
  final.forEach((c,i)=>{ const el=document.createElement('div'); el.className='chip'; el.textContent=c.t.toUpperCase(); el.style.animationDelay=(i*.06)+'s'; box.appendChild(el); });
  show('s-results');
}
function end(n){ return n===1?'ь':n<=4?'и':'ей'; }
function restart(){ show('s-welcome'); }

// ── Custom card ──
function openModal(){
  document.getElementById('inp-title').value='';
  document.getElementById('inp-desc').value='';
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('inp-title').focus(),100);
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
function addCustom(){
  const t=document.getElementById('inp-title').value.trim();
  if(!t) return;
  const d=document.getElementById('inp-desc').value.trim()||'Ваша личная ценность';
  deck.splice(idx+1,0,{t,d}); // insert right after current card
  document.getElementById('card-counter').textContent=`${idx+1} / ${deck.length}`;
  closeModal();
}
// Close modal on backdrop click
document.getElementById('modal').addEventListener('click',e=>{ if(e.target===document.getElementById('modal')) closeModal(); });
</script>
</body>
</html>
