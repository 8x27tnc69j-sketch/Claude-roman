<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #06060a; overflow: hidden; cursor: crosshair; font-family: 'Courier New', monospace; user-select: none; }
    canvas { display: block; position: fixed; inset: 0; }
    #code-wrap { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10; pointer-events: none; }
    #code-label { font-size: 10px; letter-spacing: 0.3em; color: rgba(255,255,255,0.18); }
    #code-value { font-size: 30px; font-weight: bold; letter-spacing: 0.25em; color: rgba(255,255,255,0.5); display: block; margin-top: 4px; }
    #dot { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.12); transition: background 0.5s; z-index: 10; }
    #dot.connected { background: rgba(80,220,120,0.55); }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="code-wrap">
  <div id="code-label">КОД СЕССИИ</div>
  <span id="code-value">----</span>
</div>
<div id="dot"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let W = canvas.width  = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; });

const R = 55;

// Mirror same layout as client
const target = { x: W/2, y: 130, r: R }; // red zone — TOP (same as client)

// Room
const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
document.getElementById('code-value').textContent = roomCode;

const socket = io();
socket.emit('therapist-create', roomCode);

let clientConnected = false;
let clientHolding   = false;
let pulling         = false;
let mouseX = W/2, mouseY = H/2;

// Ghost ball (client's position, normalised)
let ghostNX = 0.5, ghostNY = 0.5;

socket.on('client-connected',      ()       => { clientConnected = true;  document.getElementById('dot').classList.add('connected'); });
socket.on('client-holding-update', (h)      => { clientHolding = h; });
socket.on('ball-position-update',  ({ nx, ny }) => { ghostNX = nx; ghostNY = ny; });
socket.on('peer-disconnected',     ()       => { clientConnected = false; document.getElementById('dot').classList.remove('connected'); });

// Track mouse delta and send as velocity to client
const THERAPIST_SCALE = 0.07; // how much drag speed becomes force
let lastSentX = mouseX, lastSentY = mouseY;

setInterval(() => {
  if (!pulling || !clientConnected) return;
  const dx = mouseX - lastSentX;
  const dy = mouseY - lastSentY;
  lastSentX = mouseX; lastSentY = mouseY;
  // Only send if there's actual movement
  if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
    socket.emit('therapist-velocity', { roomCode, vx: dx * THERAPIST_SCALE, vy: dy * THERAPIST_SCALE });
  }
}, 50);

// Mouse
canvas.addEventListener('mousedown', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  // First press: snap ball to home + start exercise
  socket.emit('exercise-start', roomCode);
  pulling = true;
  socket.emit('therapist-pull', { roomCode, dx: 0, dy: 0 });
});
canvas.addEventListener('mousemove',  e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('mouseup',    () => { pulling = false; socket.emit('therapist-release', roomCode); });
canvas.addEventListener('mouseleave', () => { if (pulling) { pulling = false; socket.emit('therapist-release', roomCode); } });

// Touch
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0]; mouseX = t.clientX; mouseY = t.clientY;
  socket.emit('exercise-start', roomCode);
  pulling = true;
}, { passive: true });
canvas.addEventListener('touchmove',  e => { e.preventDefault(); const t = e.touches[0]; mouseX = t.clientX; mouseY = t.clientY; }, { passive: false });
canvas.addEventListener('touchend',   () => { pulling = false; socket.emit('therapist-release', roomCode); });

function lerp(a, b, t) { return a + (b - a) * t; }

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Ghost ball position (client's actual position)
  const ghostX = ghostNX * W;
  const ghostY = ghostNY * H;

  // Tension for ghost ball (how close to target)
  const toTarget  = Math.hypot(ghostX - target.x, ghostY - target.y);
  const totalDist = Math.hypot(target.x - W/2, target.y - H/2);
  const tension   = Math.max(0, Math.min(1, 1 - toTarget / totalDist));

  // ── Background red glow when pulling ─────────────────────────
  if (pulling) {
    const grd = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 300);
    grd.addColorStop(0, 'rgba(180,30,30,0.15)');
    grd.addColorStop(1, 'rgba(180,30,30,0)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  }

  // ── TARGET ZONE (red ring — top, same as client) ──────────────
  const tGrd = ctx.createRadialGradient(target.x, target.y, R*0.2, target.x, target.y, R*2.2);
  tGrd.addColorStop(0, `rgba(220,45,45,${0.12 + tension*0.18})`);
  tGrd.addColorStop(1, 'rgba(220,45,45,0)');
  ctx.beginPath(); ctx.arc(target.x, target.y, R*2.2, 0, Math.PI*2);
  ctx.fillStyle = tGrd; ctx.fill();

  ctx.beginPath(); ctx.arc(target.x, target.y, R, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(220,55,55,${0.4 + tension*0.5})`;
  ctx.lineWidth = 1.5; ctx.stroke();

  // ── HOME RING ─────────────────────────────────────────────────
  ctx.beginPath(); ctx.arc(W/2, H/2, R, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1; ctx.stroke();

  // ── GHOST BALL (client's circle, semi-transparent) ────────────
  const cr = Math.round(lerp(110, 255, tension));
  const cg = Math.round(lerp(90,  65,  tension));
  const cb = Math.round(lerp(240, 40,  tension));
  const col = `${cr},${cg},${cb}`;

  // Outer glow
  const bGrd = ctx.createRadialGradient(ghostX, ghostY, R*0.4, ghostX, ghostY, R*2);
  bGrd.addColorStop(0, `rgba(${col},0.14)`);
  bGrd.addColorStop(1, `rgba(${col},0)`);
  ctx.beginPath(); ctx.arc(ghostX, ghostY, R*2, 0, Math.PI*2);
  ctx.fillStyle = bGrd; ctx.fill();

  // Ghost circle fill
  ctx.beginPath(); ctx.arc(ghostX, ghostY, R, 0, Math.PI*2);
  ctx.fillStyle = `rgba(${col},0.45)`; ctx.fill();

  // Ring around ghost (slightly larger, thin)
  ctx.beginPath(); ctx.arc(ghostX, ghostY, R+3, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(${col},0.3)`;
  ctx.lineWidth = 1; ctx.stroke();

  // Client holding indicator
  if (clientHolding) {
    ctx.beginPath(); ctx.arc(ghostX, ghostY, R+10, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.5; ctx.stroke();
  }

  // ── PULL CURSOR ───────────────────────────────────────────────
  if (pulling) {
    // Dashed line from ghost ball toward cursor
    ctx.save();
    ctx.setLineDash([4, 10]);
    ctx.beginPath(); ctx.moveTo(ghostX, ghostY); ctx.lineTo(mouseX, mouseY);
    ctx.strokeStyle = 'rgba(200,55,55,0.22)'; ctx.lineWidth = 1;
    ctx.stroke(); ctx.restore();

    // Cursor ring
    ctx.beginPath(); ctx.arc(mouseX, mouseY, 20, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(210,65,65,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(mouseX, mouseY, 4, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(210,65,65,0.9)'; ctx.fill();
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
