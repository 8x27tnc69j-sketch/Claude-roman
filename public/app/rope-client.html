<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #06060a; overflow: hidden; cursor: none; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let W = canvas.width  = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  target.x = W/2; home.x = W/2; home.y = H/2;
});

const R = 55;
const target = { x: W/2, y: 130, r: R };
const home   = { x: W/2, y: H/2, r: R };

const ball = { x: W/2 + 80, y: H/2 + 60, vx: 0.8, vy: 0.5, r: R };

// Physics
const DAMPING      = 0.92;
const MAX_SPEED    = 3.2;
const WALL_MARGIN  = 80;
const DRAG_RATIO   = 0.45;
const PULL_POS     = 0.7;   // direct position shift per frame from monster
const PULL_VEL     = 0.4;

// Wander state (smooth organic drift)
let wanderAngle = Math.random() * Math.PI * 2;

// State
let monsterActive = false;
let exerciseMode  = false; // true when therapist has started
let dragging      = false;
let lastMX = ball.x, lastMY = ball.y;
let prevMX = ball.x, prevMY = ball.y;

// Socket
const roomCode = new URLSearchParams(location.search).get('room') || '';
const socket   = io();
if (roomCode) socket.emit('client-join', roomCode);

socket.on('exercise-start', () => {
  // Snap ball to home, clear velocity
  ball.x = home.x; ball.y = home.y;
  ball.vx = 0; ball.vy = 0;
  exerciseMode = true;
});

socket.on('exercise-stop', () => {
  exerciseMode  = false;
  monsterActive = false;
});

socket.on('monster-pull',    () => { monsterActive = true;  });
socket.on('monster-release', () => { monsterActive = false; });

// Send position to therapist
setInterval(() => {
  if (roomCode) socket.emit('ball-position', { roomCode, nx: ball.x/W, ny: ball.y/H });
}, 50);

// Client drag input
function hitTest(mx, my) { return Math.hypot(mx-ball.x, my-ball.y) < ball.r + 22; }

canvas.addEventListener('mousedown', e => {
  if (hitTest(e.clientX, e.clientY)) {
    dragging = true;
    lastMX = prevMX = e.clientX;
    lastMY = prevMY = e.clientY;
    socket.emit('client-holding', { roomCode, holding: true });
  }
});
canvas.addEventListener('mousemove', e => { if (dragging) { lastMX = e.clientX; lastMY = e.clientY; } });
canvas.addEventListener('mouseup',   () => {
  if (dragging) socket.emit('client-holding', { roomCode, holding: false });
  dragging = false;
});
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  if (hitTest(t.clientX, t.clientY)) {
    dragging = true; lastMX = prevMX = t.clientX; lastMY = prevMY = t.clientY;
    socket.emit('client-holding', { roomCode, holding: true });
  }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0]; lastMX = t.clientX; lastMY = t.clientY;
}, { passive: false });
canvas.addEventListener('touchend', () => {
  if (dragging) socket.emit('client-holding', { roomCode, holding: false });
  dragging = false;
});

// ── Steering helpers ────────────────────────────────────────────
function capSpeed() {
  const spd = Math.hypot(ball.vx, ball.vy);
  if (spd > MAX_SPEED) { ball.vx = (ball.vx/spd)*MAX_SPEED; ball.vy = (ball.vy/spd)*MAX_SPEED; }
}

function repulse(zx, zy, radius, strength) {
  const dx = ball.x - zx, dy = ball.y - zy;
  const dist = Math.max(Math.hypot(dx, dy), 1);
  const range = radius + 140;
  if (dist < range) {
    const f = strength * Math.pow(1 - dist/range, 2);
    ball.vx += (dx/dist) * f;
    ball.vy += (dy/dist) * f;
  }
}

// ── Physics update ──────────────────────────────────────────────
function update() {

  if (exerciseMode) {
    // ── EXERCISE MODE: monster pulls, client resists ──────────
    if (dragging) {
      ball.x += (lastMX - prevMX) * DRAG_RATIO;
      ball.y += (lastMY - prevMY) * DRAG_RATIO;
      ball.vx *= 0.5; ball.vy *= 0.5;
    }
    prevMX = lastMX; prevMY = lastMY;

    if (monsterActive) {
      // Pull directly toward target
      const toX  = target.x - ball.x;
      const toY  = target.y - ball.y;
      const dist = Math.max(Math.hypot(toX, toY), 1);
      ball.x += (toX/dist) * PULL_POS;
      ball.y += (toY/dist) * PULL_POS;
      ball.vx += (toX/dist) * PULL_VEL;
      ball.vy += (toY/dist) * PULL_VEL;
    } else {
      // Tiny random drift in exercise mode
      ball.vx += (Math.random()-0.5) * 0.05;
      ball.vy += (Math.random()-0.5) * 0.05;
    }

  } else {
    // ── FREE FLOAT MODE: organic wander, avoids red zone ─────
    if (dragging) {
      ball.x += (lastMX - prevMX) * DRAG_RATIO;
      ball.y += (lastMY - prevMY) * DRAG_RATIO;
    }
    prevMX = lastMX; prevMY = lastMY;

    // Smooth wander — slowly rotate direction
    wanderAngle += (Math.random()-0.5) * 0.12;
    ball.vx += Math.cos(wanderAngle) * 0.09;
    ball.vy += Math.sin(wanderAngle) * 0.09;

    // Repel from red target zone
    repulse(target.x, target.y, target.r, 1.2);

    // Repel from walls
    repulse(W/2, 0,    0, 0.6);
    repulse(W/2, H,    0, 0.6);
    repulse(0,   H/2,  0, 0.5);
    repulse(W,   H/2,  0, 0.5);
  }

  // Soft boundary
  if (ball.x < WALL_MARGIN)     ball.vx += 0.4;
  if (ball.x > W-WALL_MARGIN)   ball.vx -= 0.4;
  if (ball.y < WALL_MARGIN)     ball.vy += 0.4;
  if (ball.y > H-WALL_MARGIN)   ball.vy -= 0.4;

  ball.vx *= DAMPING; ball.vy *= DAMPING;
  capSpeed();

  if (!dragging) { ball.x += ball.vx; ball.y += ball.vy; }
}

// ── Draw ────────────────────────────────────────────────────────
function lerp(a, b, t) { return a + (b-a)*t; }

function draw() {
  ctx.clearRect(0, 0, W, H);

  const toTarget = Math.hypot(ball.x-target.x, ball.y-target.y);
  const total    = Math.hypot(target.x-home.x,  target.y-home.y);
  const tension  = Math.max(0, Math.min(1, 1 - toTarget/total));

  // ── Target zone ─────────────────────────────────────
  const tGrd = ctx.createRadialGradient(target.x, target.y, R*0.2, target.x, target.y, R*2.2);
  tGrd.addColorStop(0, `rgba(220,45,45,${0.10 + tension*0.22})`);
  tGrd.addColorStop(1, 'rgba(220,45,45,0)');
  ctx.beginPath(); ctx.arc(target.x, target.y, R*2.2, 0, Math.PI*2);
  ctx.fillStyle = tGrd; ctx.fill();

  ctx.beginPath(); ctx.arc(target.x, target.y, R, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(220,55,55,${0.35 + tension*0.55})`;
  ctx.lineWidth = 1.5; ctx.stroke();

  // ── Home ring (only in exercise mode) ───────────────
  if (exerciseMode) {
    ctx.beginPath(); ctx.arc(home.x, home.y, R, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1; ctx.stroke();
  }

  // ── Ball ────────────────────────────────────────────
  const cr = Math.round(lerp(110, 255, tension));
  const cg = Math.round(lerp(90,  65,  tension));
  const cb = Math.round(lerp(240, 40,  tension));
  const col = `${cr},${cg},${cb}`;

  const bGrd = ctx.createRadialGradient(ball.x, ball.y, R*0.4, ball.x, ball.y, R*2.4);
  bGrd.addColorStop(0, `rgba(${col},${0.18 + tension*0.2})`);
  bGrd.addColorStop(1, `rgba(${col},0)`);
  ctx.beginPath(); ctx.arc(ball.x, ball.y, R*2.4, 0, Math.PI*2);
  ctx.fillStyle = bGrd; ctx.fill();

  ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, Math.PI*2);
  ctx.fillStyle = `rgba(${col},${0.72 + tension*0.28})`; ctx.fill();

  if (dragging) {
    ctx.beginPath(); ctx.arc(ball.x, ball.y, R+7, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2; ctx.stroke();
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
