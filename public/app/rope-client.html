<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #06060a; overflow: hidden; cursor: none; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let W = canvas.width  = window.innerWidth;
let H = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  target.x = W / 2; target.y = 130;
  home.x   = W / 2; home.y   = H / 2;
});

const R = 55; // ball / zone radius

// Fixed zones
const target = { x: W/2, y: 130, r: R }; // red danger zone — TOP
const home   = { x: W/2, y: H/2, r: R }; // starting position — CENTER

const ball = { x: home.x, y: home.y, vx: 0, vy: 0, r: R };

// Physics
const DRAG_RATIO  = 0.45;  // comfortable default — feels easy without monster
const BASE_NOISE  = 0.03;  // near-zero drift when monster isn't pulling
const DAMPING     = 0.88;
const PULL_POS    = 0.65;  // direct position offset per frame from monster
const PULL_VEL    = 0.35;  // velocity contribution from monster
const WALL_MARGIN = 80;
const WALL_SPRING = 0.3;
const BURST_PROB  = 0.0015;
const BURST_FORCE = 1.2;

let started  = false;
let dragging = false;
let lastMX = home.x, lastMY = home.y;
let prevMX = home.x, prevMY = home.y;
let monsterActive = false;
let monsterDX = 0, monsterDY = 0; // normalised pull direction from therapist

// Socket
const roomCode = new URLSearchParams(location.search).get('room') || '';
const socket   = io();
if (roomCode) socket.emit('client-join', roomCode);

socket.on('monster-pull',    ({ dx, dy }) => { monsterActive = true;  monsterDX = dx; monsterDY = dy; });
socket.on('monster-release', ()           => { monsterActive = false; });

// Broadcast ball position to therapist (normalised coords)
setInterval(() => {
  if (!roomCode) return;
  socket.emit('ball-position', { roomCode, nx: ball.x / W, ny: ball.y / H });
}, 50);

// Input — mouse
function hitTest(mx, my) { return Math.hypot(mx - ball.x, my - ball.y) < ball.r + 22; }

canvas.addEventListener('mousedown', e => {
  if (hitTest(e.clientX, e.clientY)) {
    dragging = true; started = true;
    lastMX = e.clientX; lastMY = e.clientY;
    prevMX = e.clientX; prevMY = e.clientY;
    socket.emit('client-holding', { roomCode, holding: true });
  }
});
canvas.addEventListener('mousemove', e => { if (dragging) { lastMX = e.clientX; lastMY = e.clientY; } });
canvas.addEventListener('mouseup',   () => {
  if (dragging) socket.emit('client-holding', { roomCode, holding: false });
  dragging = false;
});

// Input — touch
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  if (hitTest(t.clientX, t.clientY)) {
    dragging = true; started = true;
    lastMX = t.clientX; lastMY = t.clientY;
    prevMX = t.clientX; prevMY = t.clientY;
    socket.emit('client-holding', { roomCode, holding: true });
  }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0]; lastMX = t.clientX; lastMY = t.clientY;
}, { passive: false });
canvas.addEventListener('touchend', () => {
  if (dragging) socket.emit('client-holding', { roomCode, holding: false });
  dragging = false;
});

// Physics update
function update() {
  if (!started) return;

  // 1. Client drag — apply delta
  if (dragging) {
    ball.x += (lastMX - prevMX) * DRAG_RATIO;
    ball.y += (lastMY - prevMY) * DRAG_RATIO;
    ball.vx *= 0.5; ball.vy *= 0.5; // bleed off velocity while holding
  }
  prevMX = lastMX; prevMY = lastMY;

  // 2. Monster pull — computed toward target zone, works EVEN while dragging
  if (monsterActive) {
    // Direction: therapist cursor → normalised unit vector toward target
    const toX  = target.x - ball.x;
    const toY  = target.y - ball.y;
    const dist = Math.max(Math.hypot(toX, toY), 1);
    const nx   = toX / dist;
    const ny   = toY / dist;

    // Direct position offset (felt immediately by client even while dragging)
    ball.x += nx * PULL_POS;
    ball.y += ny * PULL_POS;

    // Velocity for momentum when released
    ball.vx += nx * PULL_VEL;
    ball.vy += ny * PULL_VEL;
  }

  // 3. Minimal ambient drift
  ball.vx += (Math.random() - 0.5) * BASE_NOISE;
  ball.vy += (Math.random() - 0.5) * BASE_NOISE;

  // 4. Rare burst
  if (Math.random() < BURST_PROB) {
    const a = Math.random() * Math.PI * 2;
    ball.vx += Math.cos(a) * BURST_FORCE;
    ball.vy += Math.sin(a) * BURST_FORCE;
  }

  // 5. Soft screen walls
  if (ball.x < WALL_MARGIN)       ball.vx += WALL_SPRING;
  if (ball.x > W - WALL_MARGIN)   ball.vx -= WALL_SPRING;
  if (ball.y < WALL_MARGIN)       ball.vy += WALL_SPRING;
  if (ball.y > H - WALL_MARGIN)   ball.vy -= WALL_SPRING;

  ball.vx *= DAMPING;
  ball.vy *= DAMPING;

  if (!dragging) { ball.x += ball.vx; ball.y += ball.vy; }
}

// Draw
function lerp(a, b, t) { return a + (b - a) * t; }

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Tension: how close ball is to target (0=at home, 1=at target)
  const totalDist = Math.hypot(target.x - home.x, target.y - home.y);
  const toTarget  = Math.hypot(ball.x - target.x, ball.y - target.y);
  const tension   = Math.max(0, Math.min(1, 1 - toTarget / totalDist));

  // ── TARGET ZONE (top, red) ──────────────────────────────────────
  const redAlpha = 0.35 + tension * 0.55;

  // Glow behind ring
  const tGrd = ctx.createRadialGradient(target.x, target.y, R * 0.2, target.x, target.y, R * 2.2);
  tGrd.addColorStop(0, `rgba(220,45,45,${0.12 + tension * 0.2})`);
  tGrd.addColorStop(1, 'rgba(220,45,45,0)');
  ctx.beginPath(); ctx.arc(target.x, target.y, R * 2.2, 0, Math.PI * 2);
  ctx.fillStyle = tGrd; ctx.fill();

  // Red ring
  ctx.beginPath(); ctx.arc(target.x, target.y, R, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(220,55,55,${redAlpha})`;
  ctx.lineWidth = 1.5; ctx.stroke();

  // ── HOME RING (center, subtle white) ───────────────────────────
  ctx.beginPath(); ctx.arc(home.x, home.y, R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1; ctx.stroke();

  // ── BALL ────────────────────────────────────────────────────────
  const cr = Math.round(lerp(110, 255, tension));
  const cg = Math.round(lerp(90,  65,  tension));
  const cb = Math.round(lerp(240, 40,  tension));
  const col = `${cr},${cg},${cb}`;

  // Outer glow
  const bGrd = ctx.createRadialGradient(ball.x, ball.y, R*0.4, ball.x, ball.y, R*2.4);
  bGrd.addColorStop(0, `rgba(${col},${0.18 + tension*0.2})`);
  bGrd.addColorStop(1, `rgba(${col},0)`);
  ctx.beginPath(); ctx.arc(ball.x, ball.y, R*2.4, 0, Math.PI*2);
  ctx.fillStyle = bGrd; ctx.fill();

  // Fill
  ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, Math.PI*2);
  ctx.fillStyle = `rgba(${col},${0.72 + tension*0.28})`; ctx.fill();

  // Drag ring
  if (dragging) {
    ctx.beginPath(); ctx.arc(ball.x, ball.y, R+7, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.32)'; ctx.lineWidth = 2; ctx.stroke();
  }

  // Breathing pulse before start
  if (!started) {
    const p = 0.5 + 0.5 * Math.sin(Date.now() / 900);
    ctx.beginPath(); ctx.arc(home.x, home.y, R + 8 + p*7, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(110,90,240,${0.06 + p*0.08})`;
    ctx.lineWidth = 1.5; ctx.stroke();
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
