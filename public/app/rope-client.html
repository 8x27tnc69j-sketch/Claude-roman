<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #06060a; overflow: hidden; cursor: none; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let W = canvas.width  = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  target.x = W/2; home.x = W/2; home.y = H/2;
});

const R = 55;
const target = { x: W/2, y: 130, r: R };
const home   = { x: W/2, y: H/2, r: R };
const ball   = { x: W/2 + 80, y: H/2 + 60, vx: 0.6, vy: 0.4, r: R };

const DAMPING        = 0.91;
const MAX_SPEED      = 4.0;
const WALL_MARGIN    = 80;
const DRAG_RATIO     = 0.45;
const RED_ATTRACTION = 0.055; // constant weak pull to target
const DIRECT_FORCE   = 0.75;  // px/frame from therapist force (applied even while dragging)

let wanderAngle  = Math.random() * Math.PI * 2;
let exerciseMode = false;
let dragging     = false;
let lastMX = ball.x, lastMY = ball.y;
let prevMX = ball.x, prevMY = ball.y;

// Therapist force (normalised direction × strength, 0-1)
let tFx = 0, tFy = 0, monsterActive = false;

const roomCode = new URLSearchParams(location.search).get('room') || '';
const socket   = io();
if (roomCode) socket.emit('client-join', roomCode);

socket.on('exercise-start', () => {
  ball.x = home.x; ball.y = home.y;
  ball.vx = 0; ball.vy = 0;
  tFx = 0; tFy = 0;
  exerciseMode = true;
});
socket.on('exercise-stop', () => { exerciseMode = false; monsterActive = false; tFx = 0; tFy = 0; });

// Therapist sends normalised force vector (direction × strength 0-1)
socket.on('therapist-force', ({ fx, fy }) => { tFx = fx; tFy = fy; monsterActive = true; });
socket.on('monster-release', () => { monsterActive = false; tFx = 0; tFy = 0; });

setInterval(() => {
  if (roomCode) socket.emit('ball-position', { roomCode, nx: ball.x/W, ny: ball.y/H });
}, 50);

// ── Input ──────────────────────────────────────────────────────
function hitTest(mx, my) { return Math.hypot(mx-ball.x, my-ball.y) < ball.r + 22; }

canvas.addEventListener('mousedown', e => {
  if (hitTest(e.clientX, e.clientY)) {
    dragging = true;
    lastMX = prevMX = e.clientX; lastMY = prevMY = e.clientY;
    socket.emit('client-holding', { roomCode, holding: true });
  }
});
canvas.addEventListener('mousemove', e => { if (dragging) { lastMX = e.clientX; lastMY = e.clientY; } });
canvas.addEventListener('mouseup', () => {
  if (dragging) socket.emit('client-holding', { roomCode, holding: false });
  dragging = false;
});
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  if (hitTest(t.clientX, t.clientY)) {
    dragging = true; lastMX = prevMX = t.clientX; lastMY = prevMY = t.clientY;
    socket.emit('client-holding', { roomCode, holding: true });
  }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0]; lastMX = t.clientX; lastMY = t.clientY;
}, { passive: false });
canvas.addEventListener('touchend', () => {
  if (dragging) socket.emit('client-holding', { roomCode, holding: false });
  dragging = false;
});

// ── Physics ────────────────────────────────────────────────────
function capSpeed() {
  const s = Math.hypot(ball.vx, ball.vy);
  if (s > MAX_SPEED) { ball.vx = ball.vx/s*MAX_SPEED; ball.vy = ball.vy/s*MAX_SPEED; }
}
function repulse(zx, zy, str, range) {
  const dx = ball.x-zx, dy = ball.y-zy, d = Math.max(Math.hypot(dx,dy),1);
  if (d < range) { const f = str*Math.pow(1-d/range,2); ball.vx+=dx/d*f; ball.vy+=dy/d*f; }
}

function update() {
  if (exerciseMode) {

    // 1. Client drag (position)
    if (dragging) {
      ball.x += (lastMX - prevMX) * DRAG_RATIO;
      ball.y += (lastMY - prevMY) * DRAG_RATIO;
    }
    prevMX = lastMX; prevMY = lastMY;

    // 2. Therapist force — applied to position EVEN while client is dragging
    if (monsterActive) {
      ball.x += tFx * DIRECT_FORCE;
      ball.y += tFy * DIRECT_FORCE;
      // Also velocity for momentum when released
      ball.vx += tFx * 0.4;
      ball.vy += tFy * 0.4;
    }

    // 3. Red zone constant weak gravity (always)
    const toX = target.x - ball.x, toY = target.y - ball.y;
    const d   = Math.max(Math.hypot(toX, toY), 1);
    ball.vx += (toX/d) * RED_ATTRACTION;
    ball.vy += (toY/d) * RED_ATTRACTION;

    // 4. Bleed velocity while dragging (not zero — therapist still felt)
    if (dragging) { ball.vx *= 0.6; ball.vy *= 0.6; }

  } else {
    // Free-float: wander + avoid red zone
    if (dragging) {
      ball.x += (lastMX - prevMX) * DRAG_RATIO;
      ball.y += (lastMY - prevMY) * DRAG_RATIO;
    }
    prevMX = lastMX; prevMY = lastMY;

    wanderAngle += (Math.random()-0.5) * 0.12;
    ball.vx += Math.cos(wanderAngle) * 0.09;
    ball.vy += Math.sin(wanderAngle) * 0.09;
    repulse(target.x, target.y, 1.3, target.r + 150);
  }

  if (ball.x < WALL_MARGIN)   ball.vx += 0.35;
  if (ball.x > W-WALL_MARGIN) ball.vx -= 0.35;
  if (ball.y < WALL_MARGIN)   ball.vy += 0.35;
  if (ball.y > H-WALL_MARGIN) ball.vy -= 0.35;

  ball.vx *= DAMPING; ball.vy *= DAMPING;
  capSpeed();
  if (!dragging) { ball.x += ball.vx; ball.y += ball.vy; }
}

// ── Draw ───────────────────────────────────────────────────────
function lerp(a,b,t){ return a+(b-a)*t; }

function draw() {
  ctx.clearRect(0, 0, W, H);

  const toTarget = Math.hypot(ball.x-target.x, ball.y-target.y);
  const total    = Math.hypot(target.x-home.x, target.y-home.y);
  const tension  = Math.max(0, Math.min(1, 1 - toTarget/total));

  // Target zone
  const tGrd = ctx.createRadialGradient(target.x,target.y,R*0.2,target.x,target.y,R*2.2);
  tGrd.addColorStop(0, `rgba(220,45,45,${0.10+tension*0.22})`);
  tGrd.addColorStop(1, 'rgba(220,45,45,0)');
  ctx.beginPath(); ctx.arc(target.x,target.y,R*2.2,0,Math.PI*2); ctx.fillStyle=tGrd; ctx.fill();
  ctx.beginPath(); ctx.arc(target.x,target.y,R,0,Math.PI*2);
  ctx.strokeStyle=`rgba(220,55,55,${0.35+tension*0.55})`; ctx.lineWidth=1.5; ctx.stroke();

  if (exerciseMode) {
    ctx.beginPath(); ctx.arc(home.x,home.y,R,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=1; ctx.stroke();
  }

  // Ball
  const cr=Math.round(lerp(110,255,tension)), cg=Math.round(lerp(90,65,tension)), cb=Math.round(lerp(240,40,tension));
  const col=`${cr},${cg},${cb}`;
  const bGrd=ctx.createRadialGradient(ball.x,ball.y,R*0.4,ball.x,ball.y,R*2.4);
  bGrd.addColorStop(0,`rgba(${col},${0.18+tension*0.2})`); bGrd.addColorStop(1,`rgba(${col},0)`);
  ctx.beginPath(); ctx.arc(ball.x,ball.y,R*2.4,0,Math.PI*2); ctx.fillStyle=bGrd; ctx.fill();
  ctx.beginPath(); ctx.arc(ball.x,ball.y,R,0,Math.PI*2);
  ctx.fillStyle=`rgba(${col},${0.72+tension*0.28})`; ctx.fill();

  if (dragging) {
    ctx.beginPath(); ctx.arc(ball.x,ball.y,R+7,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=2; ctx.stroke();
  }
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
